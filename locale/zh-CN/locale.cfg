[mod-setting-name]
# train-trails-color=颜色
# train-trails-glow=光晕
train-trails-color-and-glow=尾迹类型
train-trails-passengers-only=仅限乘客模式
train-trails-scale=尺寸
train-trails-length=长度
train-trails-color-type=颜色类型
train-trails-theme=动画主题
train-trails-speed=动画速度
train-trails-balance=性能模式
train-trails-default-color=默认尾迹颜色

[mod-setting-description]
# train-trails-color=决定火车移动时是否产生颜色
# train-trails-glow=决定火车移动时是否产生光晕
train-trails-color-and-glow=控制颜色和光晕轨迹的参数
train-trails-passengers-only=启用后，仅为有驾驶员或乘客的火车绘制尾迹
train-trails-scale=尾迹的目标宽度。\n尾迹宽度还会根据火车速度进行额外修正
train-trails-length=尾迹的目标持续时间。\n尾迹长度还会根据火车车厢数量进行额外修正
train-trails-color-type=“列车同步” 将使用火车当前颜色作为尾迹颜色。\n“动画颜色” 将使用颜色主题和速度设置生成动态循环颜色
train-trails-theme=动态颜色尾迹的颜色主题
train-trails-speed=尾迹颜色循环动画的速度
train-trails-balance=平衡视觉效果与游戏性能的性能模式
train-trails-default-color=未设置颜色的火车的尾迹颜色。\n默认情况下，新建造的火车在玩家或模组为其指定颜色之前没有颜色（尽管它们显示为红色）

